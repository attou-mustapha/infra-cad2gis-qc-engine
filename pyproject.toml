[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2gis-qc-engine"
version = "0.1.0"
description = "Automated CAD/BIM to GIS Topological Quality Control Engine for Transportation Infrastructure"
readme = "README.md"
authors = [
    { name = "Mustapha ATTOU", email = "mustapha.attou@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "fiona>=1.9.0",
    "networkx>=3.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "jinja2>=3.1.2",
    "pydantic>=2.5.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.9.0",
    "ruff>=0.1.0"
]

[project.scripts]
cad2gis-qc = "cad2gis_qc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
